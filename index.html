<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>응급 증상 체크</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>지금 응급실에 가야 할까요?</h1>
    <p class="notice">⚠️ 이 결과는 참고용입니다. 생명이 위험하다고 느껴지면 바로 <b>119</b>에 전화하세요.</p>

    <section class="text-input">
    <h2> 증상을 직접 적어 주세요</h2>
    <textarea id="symptom-text" rows="4" placeholder="예: 30분 전부터 가슴이 답답하고 식은땀이 나요"></textarea>
    <button id="analyze-btn">판정하기</button>
    </section>

        <p class="divider">─ 또는 불편한 부위에서 해당하는 증상을 골라 주세요 ─</p>
    <p class="sub-guide">본인 또는 옆에 있는 사람의 증상을 모두 골라 주세요.</p>

    <section class="group part-head">
      <h2> 머리 · 눈</h2>
      <label><input type="checkbox" value="red"> 갑자기 얼굴이나 팔다리 한쪽에 힘이 빠지거나, 말이 어눌해졌어요</label>
      <label><input type="checkbox" value="red"> 머리를 부딪힌 뒤 토하거나 정신이 멍해요</label>
      <label><input type="checkbox" value="yellow"> 갑자기 눈이 잘 안 보여요</label>
      <label><input type="checkbox" value="yellow"> 눈에 세제, 락스 같은 약품이 들어갔어요</label>
    </section>

    <section class="group part-chest">
      <h2> 가슴 · 숨</h2>
      <label><input type="checkbox" value="red"> 숨이 너무 차서 말을 끝까지 잇기 힘들어요</label>
      <label><input type="checkbox" value="red"> 음식이나 약을 먹은 뒤 입술과 얼굴이 붓고 숨쉬기 힘들어요</label>
      <label><input type="checkbox" value="green"> 콧물, 기침, 목 아픔 같은 감기 기운이 있어요</label>
      <label><input type="checkbox" value="red"> 가슴을 쥐어짜거나 무언가 짓누르는 듯이 아파요</label>
      <label><input type="checkbox" value="yellow"> 가만히 있는데도 심장이 갑자기 너무 빠르거나 불규칙하게 뛰어요</label>
    </section>

    <section class="group part-belly">
      <h2> 배</h2>
      <label><input type="checkbox" value="yellow"> 배가 너무 아파서 몸을 펴거나 움직이기 힘들어요</label>
      <label><input type="checkbox" value="green"> 배탈이나 설사가 조금 있지만 물은 잘 마셔요</label>
      <label><input type="checkbox" value="yellow"> 피를 토하거나, 피 섞인 변 또는 까만 변을 봐요</label>
      <label><input type="checkbox" value="yellow"> 계속 토하거나 설사해서 물도 못 마시고, 소변이 거의 안 나와요</label>
    </section>

    <section class="group part-limb">
      <h2> 팔다리 · 피부 (다쳤을 때)</h2>
      <label><input type="checkbox" value="green"> 살짝 베이거나 멍이 들었어요</label>
      <label><input type="checkbox" value="red"> 피 나는 곳을 꾹 눌러도 피가 멈추지 않아요</label>
      <label><input type="checkbox" value="yellow"> 뼈가 부러져 튀어나왔거나, 날카로운 것에 깊이 찔렸어요</label>
      <label><input type="checkbox" value="yellow"> 다리 한쪽에 넓게 화상을 입었어요</label>
    </section>

    <section class="group part-body">
      <h2> 온몸 · 마음</h2>
      <label><input type="checkbox" value="red"> 정신을 잃었거나, 불러도 반응이 둔해요</label>
      <label><input type="checkbox" value="red"> 몸이 뻣뻣해지면서 떨리는 경련(발작)을 해요</label>
      <label><input type="checkbox" value="green"> 열이 나지만 물을 잘 마시고 평소처럼 움직일 수 있어요</label>
      <label><input type="checkbox" value="red"> 식은땀이 나고 얼굴이 창백하며 쓰러질 것 같아요</label>
      <label><input type="checkbox" value="red"> 약, 술, 농약 등을 한꺼번에 많이 먹었어요</label>
      <label><input type="checkbox" value="red"> 나 자신이나 다른 사람을 해칠 것 같은 생각이 들어요</label>
    </section>

    <button id="check-btn">결과 보기</button>
    <div id="result"></div>
        <p class="source">증상 분류 참고: 국립중앙의료원 「응급증상 및 비응급증상 안내」</p>
  </div>
  <script src="analyzer.js"></script>
  <script src="script.js"></script>
</body>

</html>
